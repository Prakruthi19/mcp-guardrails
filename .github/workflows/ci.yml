name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opsguard .
      - name: Smoke test the image
        run: |
          docker run -d --name og -p 8000:8000 opsguard
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/chat \
            -H "Authorization: Bearer demo-bob" -H "Content-Type: application/json" \
            -d '{"message": "Why is job 4521 pending?"}' | grep -q "gpu-02"
